[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recon_agent_tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "shodan>=1.31.0",
    "pyyaml>=6.0.2",
]
