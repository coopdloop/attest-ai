[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent_orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "litellm>=1.99.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.9",
]
