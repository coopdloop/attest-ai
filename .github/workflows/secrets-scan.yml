name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so diff scans have a base to compare against.
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # On PRs scan only the diff; on push/schedule scan full history.
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Only fail on verified, live secrets to keep noise low.
          # Note: the action already appends --fail; do not add it here.
          extra_args: --results=verified,unknown
