name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go services
          - image: signing_service
            context: services/signing_service
            dockerfile: services/signing_service/Dockerfile
          - image: auth_service
            context: services/auth_service
            dockerfile: services/auth_service/Dockerfile
          # attestation_service needs the shared services/ context (local replace directive)
          - image: attestation_service
            context: services
            dockerfile: services/attestation_service/Dockerfile
          - image: trace_query_service
            context: services/trace_query_service
            dockerfile: services/trace_query_service/Dockerfile
          - image: api_gateway
            context: services/api_gateway
            dockerfile: services/api_gateway/Dockerfile
          # Python services
          - image: agent_orchestrator
            context: services/agent_orchestrator
            dockerfile: services/agent_orchestrator/Dockerfile
          - image: context_library
            context: services/context_library
            dockerfile: services/context_library/Dockerfile
          - image: recon_agent_tools
            context: services/recon_agent_tools
            dockerfile: services/recon_agent_tools/Dockerfile
          - image: threat_intel_agent_tools
            context: services/threat_intel_agent_tools
            dockerfile: services/threat_intel_agent_tools/Dockerfile
          - image: redteam_agent_tools
            context: services/redteam_agent_tools
            dockerfile: services/redteam_agent_tools/Dockerfile
          # Frontend
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/attest-ai/${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/attest-ai/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
